<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gujarati Trader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #060608;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Professional Multi-Layer Ambient Glow Background */
    .glow-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-gold {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 204, 0, 0.18) 0%, rgba(255, 204, 0, 0.05) 45%, rgba(0, 0, 0, 0) 70%);
      top: 30%;
      left: 50%;
      transform: translate(-140%, -50%);
      border-radius: 50%;
      filter: blur(65px);
      animation: floatGlowGold 10s ease-in-out infinite alternate;
    }

    .bg-glow-blue {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 136, 204, 0.22) 0%, rgba(0, 136, 204, 0.05) 50%, rgba(0, 0, 0, 0) 75%);
      top: 50%;
      left: 50%;
      transform: translate(30%, -40%);
      border-radius: 50%;
      filter: blur(75px);
      animation: floatGlowBlue 12s ease-in-out infinite alternate;
    }

    .bg-glow-center {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: blur(40px);
    }

    /* Main Card Container with Glassmorphism */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 136, 204, 0.15);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Profile Image */
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #ffcc00;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.45);
      animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1), floatImage 4s ease-in-out infinite alternate;
    }

    /* Title Section */
    .title-container {
      text-align: center;
      margin-bottom: 12px;
    }

    .title {
      color: #ffcc00;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
    }

    .crown {
      font-size: 18px;
      animation: glowCrown 2s infinite alternate;
    }

    /* Subtitle Tag */
    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
      color: #e0e0e0;
      margin-top: 8px;
      margin-bottom: 24px;
    }

    .check-icon {
      background-color: #22c55e;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Info Buttons */
    .info-btn {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      cursor: default;
    }

    .info-btn:hover {
      background-color: rgba(255, 204, 0, 0.12);
      border-color: #ffcc00;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.15);
    }

    /* Main CTA Join Button */
    .cta-button {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #0088cc, #005580);
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 20px 0;
      box-shadow: 0 4px 25px rgba(0, 136, 204, 0.55);
      animation: pulse 2s infinite;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    /* Shimmer Effect on CTA Button */
    .cta-button::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.35) 50%,
        transparent 70%
      );
      transform: rotate(30deg);
      animation: shimmer 3s infinite;
    }

    .cta-button:hover {
      box-shadow: 0 6px 30px rgba(0, 136, 204, 0.75);
      transform: scale(1.02);
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    .telegram-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      z-index: 1;
    }

    .cta-button span {
      z-index: 1;
    }

    /* Feature List Items */
    .feature-item {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .feature-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateX(4px);
    }

    .feature-check {
      background-color: #22c55e;
      color: #000;
      font-size: 11px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    /* Footer Links */
    .footer-links {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      justify-content: center;
    }

    .footer-links button {
      background: none;
      border: none;
      color: #888888;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }

    .footer-links button:hover {
      color: #ffcc00;
      transform: translateY(-1px);
    }

    /* Modal (Popup) Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background-color: #1a1a1e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffcc00;
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal-body {
      font-size: 14px;
      color: #ccc;
      line-height: 1.6;
      max-height: 250px;
      overflow-y: auto;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes floatImage {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    @keyframes floatGlowGold {
      0% { transform: translate(-140%, -50%) scale(1); }
      100% { transform: translate(-120%, -40%) scale(1.15); }
    }

    @keyframes floatGlowBlue {
      0% { transform: translate(30%, -40%) scale(1); }
      100% { transform: translate(15%, -50%) scale(1.2); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(0, 136, 204, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 136, 204, 0); }
    }

    @keyframes shimmer {
      0% { transform: translateX(-150%) rotate(30deg); }
      100% { transform: translateX(150%) rotate(30deg); }
    }

    @keyframes glowCrown {
      0% { filter: drop-shadow(0 0 2px rgba(255, 204, 0, 0.4)); }
      100% { filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.9)); }
    }
  </style>

      </svg>

    <div class="feature-item">
      <span class="feature-check">✓</span>

    <div class="feature-item">

  </div>

  <div class="modal-overlay" id="infoModal" onclick="closeModalOnOutsideClick(event)">
    <div class="modal-box">
      <div class="modal-header">

  <script>
    const modalData = {
      about: {
        title: "About Us",
        content: "Welcome to GUJARATI (TRADER). We provide Educational Market Insights, Technical Analysis, and Stock Market Learning content."
      },
      terms: {
        title: "Terms & Conditions",
        content: "All content provided on this channel is strictly for educational purposes. We are not responsible for any financial profits or losses."
      },
      disclaimer: {
        title: "Disclaimer",
        content: "Trading and investing in stock markets involves financial risk. Consult your financial advisor before taking any investment decisions."
      },
      contact: {
        title: "Contact Us",
        content: "For inquiries and updates, connect with us on Telegram: <br><br><b>Telegram Link:</b> https://t.me/+3cr7KekzaplmYmNl"
      }
    };

    function openModal(key) {
      if (modalData[key]) {
        document.getElementById('modalTitle').innerText = modalData[key].title;
        document.getElementById('modalContent').innerHTML = modalData[key].content;
        document.getElementById('infoModal').classList.add('active');
      }
    }

    function closeModal() {
      document.getElementById('infoModal').classList.remove('active');
    }

    function closeModalOnOutsideClick(e) {
      if (e.target.classList.contains('modal-overlay')) {
        closeModal();
      }
    }
  </script>
